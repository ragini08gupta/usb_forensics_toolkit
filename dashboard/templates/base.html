<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}USB Forensics{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="{{ url_for('index') }}">
    <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="30" height="30">
    <span>USB Forensics Investigation Toolkit</span>
  </a>
  <div class="spacer"></div>
  <div class="actions">{% block actions %}{% endblock %}</div>
</div></header>
<main><div class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}" role="status">{{ msg }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</div></main>
{% block scripts %}{% endblock %}
</body>
</html>
